<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gabarita · Mundo SENAI</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400..900&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">

<!-- Tailwind (Play CDN). Sem internet na TV: salve este script como tailwind.js e troque o src. -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: { sky: '#7DB8FF', rubi: '#FF4D6A', mist: '#9AA9CF' },
        fontFamily: {
          display: ['Archivo', 'Inter Display', 'Arial', 'sans-serif'],
          mono: ['"JetBrains Mono"', 'DejaVu Sans Mono', 'monospace'],
        },
      },
    },
  };
</script>

<style>
  :root {
    --bg: #040817;
    --azul: #2F7BFF;
    --sky: #7DB8FF;
    --rubi: #FF4D6A;
    --mist: #9AA9CF;
    --paper: #EEF1F7;
    --ink: #0B1433;
    --smooth: cubic-bezier(.22, 1, .36, 1);
  }

  html, body { margin: 0; height: 100%; background: #01030A; overflow: hidden; }
  body { font-family: Archivo, 'Inter Display', sans-serif; -webkit-font-smoothing: antialiased; }
  ::selection { background: var(--azul); color: #fff; }
  body.idle { cursor: none; }

  /* ============ Palco 1920x1080 escalado (16:9) ============ */
  #stage {
    position: absolute; left: 50%; top: 50%;
    width: 1920px; height: 1080px; overflow: hidden;
    transform-origin: 0 0; color: #fff;
    background:
      radial-gradient(70% 90% at 0% 0%, rgba(47,123,255,.16), transparent 60%),
      radial-gradient(55% 70% at 100% 100%, rgba(255,77,106,.10), transparent 60%),
      linear-gradient(180deg, #060C22 0%, var(--bg) 100%);
  }
  /* malha de bolhas de gabarito + scanner global */
  #omr-bg { position: absolute; inset: 0; pointer-events: none; }
  .scanner {
    position: absolute; top: 0; bottom: 0; left: 0; width: 2px; pointer-events: none; opacity: 0;
    background: linear-gradient(180deg, transparent, #9CCBFF 12%, #FFFFFF 50%, #9CCBFF 88%, transparent);
    box-shadow: 0 0 18px 3px rgba(47,123,255,.75), 0 0 60px 10px rgba(47,123,255,.25);
    transition: opacity .5s ease;
    will-change: transform;
  }
  .scanner::before { /* rastro do feixe */
    content: ""; position: absolute; top: 0; bottom: 0; right: 2px; width: 260px;
    background: linear-gradient(90deg, transparent, rgba(47,123,255,.10));
  }
  /* escurece a área do texto para a malha nunca competir com a leitura */
  .veil { position: absolute; inset: 0; pointer-events: none;
    background: radial-gradient(900px 640px at 22% 52%, rgba(4,8,23,.88), rgba(4,8,23,.55) 55%, transparent 80%); }
  /* horizonte sutil */
  .horizon { position: absolute; left: 0; right: 0; top: 1079px; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,.12), transparent); }

  /* ============ Entrada ============ */
  .in { opacity: 0; transform: translateY(24px); }
  .ready .in { animation: rise 1.4s var(--smooth) forwards; animation-delay: var(--t, 0s); }
  @keyframes rise { to { opacity: 1; transform: none; } }

  /* ============ Coluna de texto ============ */
  .col-text {
    position: absolute; left: 128px; top: 176px; bottom: 112px; width: 820px;
    display: flex; flex-direction: column; justify-content: center;
  }
  .title { white-space: nowrap; letter-spacing: -0.045em; line-height: .9; margin: 0; }
  .slogan { margin-top: 80px !important; }
  .title .mask { display: inline-block; padding: 0 .04em .08em 0; margin-bottom: -.08em; clip-path: inset(-40% -10% 0 -10%); }
  .title .word { display: inline-block; transform: translateY(102%); }
  .ready .title .word { animation: word 1.5s var(--smooth) .25s forwards; }
  @keyframes word { to { transform: none; } }
  .slogan > span { display: block; white-space: nowrap; }

  /* ============ Coluna da demonstração ============ */
  .col-demo { position: absolute; left: 1060px; top: 128px; width: 760px; height: 840px; }
  .stage3d { position: absolute; inset: 0; perspective: 2400px; }
  .sheet {
    position: absolute; left: 70px; top: 76px; width: 620px; padding-bottom: 64px;
    background: linear-gradient(172deg, #F7F9FD, var(--paper) 55%, #E3E8F2);
    border-radius: 16px; color: var(--ink);
    transform: rotateX(9deg) rotateY(-14deg) rotateZ(3deg);
    box-shadow: 0 1px 0 rgba(255,255,255,.6) inset, 0 50px 100px -30px rgba(0,0,0,.9), 0 18px 36px -18px rgba(0,0,0,.6);
    animation: hover3d 16s ease-in-out infinite alternate;
    will-change: transform;
  }
  @keyframes hover3d { to { transform: rotateX(7deg) rotateY(-10deg) rotateZ(2deg) translateY(-10px); } }
  .ready .sheet-in { animation: sheet-in 1.8s var(--smooth) .55s both; }
  .sheet-in { opacity: 0; }
  @keyframes sheet-in { from { opacity: 0; transform: translateY(60px); } to { opacity: 1; transform: none; } }

  .fid { position: absolute; width: 24px; height: 24px; background: var(--ink); border-radius: 3px; }
  .fid::after {
    content: ""; position: absolute; inset: -11px; border: 2.5px solid var(--azul); border-radius: 8px;
    opacity: 0; transform: scale(1.35); transition: opacity .6s var(--smooth), transform .9s var(--smooth);
  }
  .sheet.locked .fid::after { opacity: 1; transform: none; }

  .omr { display: grid; grid-template-columns: 36px repeat(5, 42px); row-gap: 13px; align-items: center; justify-items: center; }
  .omr .h { font-family: 'JetBrains Mono', monospace; font-size: 14px; font-weight: 600; color: #6A7696; }
  .omr .n { font-family: 'JetBrains Mono', monospace; font-size: 16px; font-weight: 600; color: var(--ink); justify-self: start; }
  .bub { position: relative; width: 26px; height: 26px; border-radius: 50%; border: 2px solid #A3AEC8; }
  .bub.m { background: var(--ink); border-color: var(--ink); }
  .bub.m::after {
    content: ""; position: absolute; inset: -7px; border-radius: 9px; border: 2.5px solid var(--azul);
    opacity: 0; transform: scale(1.25); transition: opacity .5s var(--smooth), transform .7s var(--smooth);
  }
  .bub.m.x::after { border-color: var(--rubi); }
  .bub.k::after {
    content: ""; position: absolute; inset: 3px; border-radius: 50%; border: 2px dashed var(--azul);
    opacity: 0; transition: opacity .6s var(--smooth);
  }
  .bub.hit.m::after { opacity: 1; transform: none; }
  .bub.hit.m { animation: pop .9s var(--smooth); }
  .bub.hit.m:not(.x) { box-shadow: 0 0 0 0 rgba(47,123,255,0); animation: pop .9s var(--smooth), ring-b 1.1s ease-out; }
  .bub.hit.m.x { animation: pop .9s var(--smooth), ring-r 1.1s ease-out; }
  @keyframes pop { 0% { transform: scale(1); } 22% { transform: scale(1.45); } 55% { transform: scale(.94); } 100% { transform: scale(1); } }
  @keyframes ring-b { 0% { box-shadow: 0 0 0 0 rgba(47,123,255,.75); } 100% { box-shadow: 0 0 0 22px rgba(47,123,255,0); } }
  @keyframes ring-r { 0% { box-shadow: 0 0 0 0 rgba(255,77,106,.8); } 100% { box-shadow: 0 0 0 22px rgba(255,77,106,0); } }
  .bub.hit.k::after { opacity: 1; }

  /* feixe de leitura, movido por JS com easing contínuo */
  .beam { position: absolute; left: 0; right: 0; top: 0; height: 110px; pointer-events: none; opacity: 0;
    background: linear-gradient(180deg, rgba(47,123,255,0), rgba(47,123,255,.13));
    border-bottom: 3px solid #4C8DFF; box-shadow: 0 6px 18px -4px rgba(47,123,255,.9);
    transition: opacity .5s ease; will-change: transform; }
  .beam.on { opacity: 1; }

  /* ============ Vidro premium ============ */
  .glass {
    background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,.025));
    border: 1px solid rgba(255,255,255,.10);
    -webkit-backdrop-filter: blur(40px) saturate(180%); backdrop-filter: blur(40px) saturate(180%);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.08), 0 24px 48px -24px rgba(0,0,0,.6);
  }
  .hud { opacity: 0; transform: translateY(10px); transition: opacity .8s var(--smooth), transform 1s var(--smooth); }
  .hud.on { opacity: 1; transform: none; }
  .seg { height: 6px; border-radius: 2px; background: rgba(125,184,255,.85); }
  .seg.x { background: var(--rubi); }

  @media (prefers-reduced-motion: reduce) {
    .sheet { animation: none !important; }
    .in, .sheet-in, .title .word { opacity: 1 !important; transform: none !important; animation: none !important; }
  }
</style>
</head>

<body>
<div id="stage" class="font-display">
  <canvas id="omr-bg" width="1920" height="1080" aria-hidden="true"></canvas>
  <div class="scanner" id="scanner" aria-hidden="true"></div>
  <div class="veil" aria-hidden="true"></div>
  <div class="horizon" aria-hidden="true"></div>

  <!-- Logos (troque os textos pelas imagens oficiais em branco) -->
  <header class="in absolute flex items-center gap-[28px]" style="left: 128px; top: 80px; --t: .1s;">
    <!-- <img src="logo-mundo-senai.svg" alt="Mundo SENAI" class="h-[52px]"> -->
    <span class="text-[28px] font-[900] tracking-[-0.01em] uppercase leading-[1]">Mundo<br>SENAI</span>
    <span class="block w-[1px] h-[52px] bg-white/20"></span>
    <!-- <img src="logo-desenvolvimento-sistemas.svg" alt="Desenvolvimento de Sistemas" class="h-[52px]"> -->
    <span class="text-[21px] font-[500] leading-[1.2] text-white/75">Técnico em<br>Desenvolvimento de Sistemas</span>
  </header>

  <!-- Coluna de texto: nada da demonstração entra aqui -->
  <section class="col-text">
    <h1 class="title text-[232px] font-[900]" id="title" aria-label="Gabarita">
      <span class="mask" aria-hidden="true"><span class="word">Gabarita</span></span>
    </h1>

    <p class="slogan in mt-[80px] m-0 text-[76px] font-[700] leading-[1.04] tracking-[-0.03em]" id="slogan" style="--t: .75s;">
      <span>Correção de provas</span>
      <span>em segundos.</span>
      <span class="text-rubi">Na palma da mão.</span>
    </p>

    <div class="in mt-[64px] flex items-center gap-[20px] text-[25px] font-[500] text-mist whitespace-nowrap" style="--t: 1.05s;">
      <span>Aponte a câmera</span>
      <svg width="30" height="12" viewBox="0 0 30 12" fill="none" stroke="#7DB8FF" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M1 6h27M23 1l5 5-5 5"/></svg>
      <span>Leitura óptica</span>
      <svg width="30" height="12" viewBox="0 0 30 12" fill="none" stroke="#7DB8FF" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><path d="M1 6h27M23 1l5 5-5 5"/></svg>
      <span class="text-white font-[600]">Nota na hora</span>
    </div>
  </section>

  <!-- Coluna da demonstração (dados fictícios) -->
  <section class="col-demo" aria-label="Demonstração de leitura de um cartão-resposta">
    <!-- status -->
    <div class="glass hud absolute rounded-[14px] flex items-center gap-[12px]" id="hud-lock" style="right: 40px; top: 0; padding: 12px 20px;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#7DB8FF" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9V4h5M15 4h5v5M20 15v5h-5M9 20H4v-5"/></svg>
      <span class="font-mono text-[17px] font-[500] text-white/90">4/4 marcadores · alinhado</span>
    </div>

    <div class="stage3d sheet-in">
      <div class="sheet" id="sheet">
        <span class="fid" style="left: 16px; top: 16px;"></span>
        <span class="fid" style="right: 16px; top: 16px;"></span>
        <span class="fid" style="left: 16px; bottom: 16px;"></span>
        <span class="fid" style="right: 16px; bottom: 16px;"></span>
        <div style="padding: 50px 58px 0;">
          <div class="flex items-center justify-between">
            <span class="text-[24px] font-[900] tracking-[-0.01em]">CARTÃO-RESPOSTA</span>
            <span class="font-mono text-[15px] font-[600] text-[#6A7696]">PROVA 03</span>
          </div>
          <div class="mt-[16px] flex gap-[24px] text-[15px] text-[#6A7696]">
            <span>Nome <span class="inline-block w-[230px] border-b-[1.5px] border-[#A3AEC8]"></span></span>
            <span>Turma <span class="inline-block w-[64px] border-b-[1.5px] border-[#A3AEC8]"></span></span>
          </div>
          <div class="mt-[30px] flex justify-between" id="omr"></div>
        </div>
        <span class="beam" id="beam"></span>
      </div>
    </div>

    <!-- resultado: fica abaixo do cartão, sobre o fundo escuro -->
    <div class="glass hud absolute rounded-[20px] flex items-center gap-[36px]" id="hud-result" style="left: 40px; bottom: 0; width: 680px; padding: 22px 32px;">
      <div class="flex items-baseline gap-[10px]">
        <span class="text-[76px] font-[900] leading-[1] tracking-[-0.04em]">18<span class="text-white/45">/20</span></span>
      </div>
      <div class="flex-1">
        <div class="flex justify-between text-[19px] font-[500] text-white/70">
          <span>Acertos</span><span>Nota <span class="text-white font-[700]">9,0</span></span>
        </div>
        <div class="mt-[14px] grid gap-[4px]" style="grid-template-columns: repeat(20, 1fr);" id="segs"></div>
      </div>
    </div>
  </section>
</div>

<script>
  const stage = document.getElementById('stage');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* Escala 16:9 */
  const fit = () => { const s = Math.min(innerWidth / 1920, innerHeight / 1080); stage.style.transform = `scale(${s}) translate(-50%, -50%)`; };
  addEventListener('resize', fit); fit();

  /* Tela cheia (F ou duplo clique) e cursor oculto */
  const fs = () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.();
  addEventListener('keydown', e => { if (e.key.toLowerCase() === 'f') fs(); });
  addEventListener('dblclick', fs);
  let idle; addEventListener('mousemove', () => { document.body.classList.remove('idle'); clearTimeout(idle); idle = setTimeout(() => document.body.classList.add('idle'), 2000); });

  /* Ajuste tipográfico: mede a largura real (sem quebra) e reduz o corpo até caber na coluna.
     scrollWidth é medido em px de layout, independente da escala do palco. */
  const COL = 800; // largura útil da coluna de texto (820px) com margem de segurança
  function fitText(el, base) {
    el.style.fontSize = base + 'px';
    const lines = el.children.length ? [...el.children] : [el];
    const widest = Math.max(...lines.map(l => l.scrollWidth));
    if (widest > COL) el.style.fontSize = Math.floor(base * COL / widest) + 'px';
  }
  const title = document.getElementById('title'), slogan = document.getElementById('slogan');
  function fitAll() { fitText(title.querySelector('.mask'), 232); title.style.fontSize = title.querySelector('.mask').style.fontSize; fitText(slogan, 76); }
  fitAll(); document.fonts.ready.then(fitAll); addEventListener('load', fitAll);

  /* Cartão fictício: 20 questões; erros na 07 e na 16 */
  const KEY   = 'BDACEBADCEABDCEBADCA';
  const MARKS = 'BDACEBCDCEABDCEDADCA';
  const omr = document.getElementById('omr');
  for (let col = 0; col < 2; col++) {
    let h = '<span></span>' + [...'ABCDE'].map(l => `<span class="h">${l}</span>`).join('');
    for (let r = 0; r < 10; r++) {
      const q = col * 10 + r;
      h += `<span class="n">${String(q + 1).padStart(2, '0')}</span>`;
      for (const l of 'ABCDE') {
        const c = ['bub'];
        if (MARKS[q] === l) c.push('m'), MARKS[q] !== KEY[q] && c.push('x');
        if (KEY[q] === l && MARKS[q] !== KEY[q]) c.push('k');
        h += `<span class="${c.join(' ')}" data-row="${r}"></span>`;
      }
    }
    const g = document.createElement('div'); g.className = 'omr'; g.innerHTML = h; omr.appendChild(g);
  }
  document.getElementById('segs').innerHTML = [...KEY].map((k, i) => `<span class="seg${MARKS[i] !== k ? ' x' : ''}"></span>`).join('');

  const sheet = document.getElementById('sheet'), beam = document.getElementById('beam');
  const lock = document.getElementById('hud-lock'), result = document.getElementById('hud-result');
  const bubs = [...sheet.querySelectorAll('.bub')];
  const rowEls = [...sheet.querySelectorAll('.n')].slice(0, 10);
  const rowY = () => rowEls.map(el => { let y = el.offsetHeight / 2; for (let e = el; e && e !== sheet; e = e.offsetParent) y += e.offsetTop; return y; });
  const setRow = (r, on) => bubs.forEach(b => { if (+b.dataset.row === r) b.classList.toggle('hit', on); });
  const clearAll = () => bubs.forEach(b => b.classList.remove('hit'));
  const wait = ms => new Promise(r => setTimeout(r, ms));
  const ease = t => t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; // easeInOutCubic

  /* Feixe com rAF: a marcação acontece exatamente quando o feixe cruza a linha */
  function scan(duration) {
    return new Promise(done => {
      const H = sheet.offsetHeight, ys = rowY(), BH = beam.offsetHeight;
      let marked = 0, t0 = null;
      beam.classList.add('on');
      function step(now) {
        t0 ??= now;
        const p = Math.min((now - t0) / duration, 1);
        const edge = ease(p) * H;                 // posição da borda inferior do feixe
        beam.style.transform = `translateY(${edge - BH}px)`;
        while (marked < ys.length && edge >= ys[marked]) setRow(marked++, true);
        if (p < 1) requestAnimationFrame(step); else { beam.classList.remove('on'); done(); }
      }
      requestAnimationFrame(step);
    });
  }

  async function loop() {
    while (true) {
      sheet.classList.add('locked'); lock.classList.add('on');
      await wait(900);
      await scan(4200);
      result.classList.add('on');
      await wait(3800);
      result.classList.remove('on'); lock.classList.remove('on'); sheet.classList.remove('locked'); clearAll();
      await wait(1400);
    }
  }

  /* ===== Fundo: malha de bolhas lida por um scanner que cruza a tela ===== */
  const bg = document.getElementById('omr-bg'), g2 = bg.getContext('2d'), scanner = document.getElementById('scanner');
  const GAP = 44, R = 9, cells = [];
  for (let y = GAP / 2 + 4; y < 1080; y += GAP) for (let x = GAP / 2; x < 1920; x += GAP) cells.push({ x, y, lit: -1, red: false });
  function paint(now) {
    g2.clearRect(0, 0, 1920, 1080);
    g2.lineWidth = 1.5; g2.strokeStyle = 'rgba(154,169,207,.11)'; g2.beginPath();
    for (const c of cells) { g2.moveTo(c.x + R, c.y); g2.arc(c.x, c.y, R, 0, 6.283); }
    g2.stroke();
    let active = false;
    for (const c of cells) {
      if (c.lit < 0) continue;
      const age = (now - c.lit) / 1400; // 1,4s de brilho
      if (age >= 1) { c.lit = -1; continue; }
      active = true;
      const a = age < .12 ? age / .12 : 1 - (age - .12) / .88;
      const rgb = c.red ? '255,77,106' : '76,141,255';
      g2.beginPath(); g2.arc(c.x, c.y, R + 8, 0, 6.283); g2.fillStyle = `rgba(${rgb},${.16 * a})`; g2.fill();
      g2.beginPath(); g2.arc(c.x, c.y, R - 1.5, 0, 6.283); g2.fillStyle = `rgba(${rgb},${.85 * a})`; g2.fill();
    }
    return active;
  }
  function sweep() {
    const D = 2600, t0 = performance.now();
    const byCol = new Map(); cells.forEach(c => (byCol.get(c.x) || byCol.set(c.x, []).get(c.x)).push(c));
    const cols = [...byCol.keys()].sort((a, b) => a - b); let ci = 0;
    scanner.style.opacity = 1;
    (function frame(now) {
      const p = Math.min((now - t0) / D, 1), x = ease(p) * 1960 - 20;
      scanner.style.transform = `translateX(${x}px)`;
      while (ci < cols.length && cols[ci] <= x) {
        for (const c of byCol.get(cols[ci])) {
          const odds = c.x < 1000 ? .05 : .16;          // menos brilho atrás do texto
          if (Math.random() < odds) { c.lit = now; c.red = Math.random() < .12; }
        }
        ci++;
      }
      const active = paint(now);
      if (p < 1 || active) requestAnimationFrame(frame); else paint(now);
      if (p >= 1) scanner.style.opacity = 0;
    })(t0);
  }
  paint(0);

  if (reduce) {
    sheet.classList.add('locked'); lock.classList.add('on'); result.classList.add('on');
    for (let r = 0; r < 10; r++) setRow(r, true);
  } else {
    requestAnimationFrame(() => stage.classList.add('ready'));
    setTimeout(loop, 2400);
    setTimeout(() => { sweep(); setInterval(sweep, 9000); }, 900);
  }
</script>
</body>
</html>
